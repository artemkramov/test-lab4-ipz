[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W – pycodestyle, F – pyflakes, I – isort, B – bugbear, UP – pyupgrade, N – pep8-naming
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=shop --cov-report=term-missing --cov-fail-under=80"